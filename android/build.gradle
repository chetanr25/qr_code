allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// AGP 8 requires a namespace; older plugins don't declare one.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") && project.android.namespace == null) {
            def manifest = new XmlSlurper().parse(project.file("src/main/AndroidManifest.xml"))
            project.android.namespace = manifest.@package.toString()
        }
        // Old plugins target Java 1.8 while Kotlin defaults to the JDK (21); align both.
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android.compileSdkVersion 35
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        project.tasks.matching { it.name.contains("Kotlin") && it.hasProperty("kotlinOptions") }.configureEach {
            kotlinOptions.jvmTarget = "11"
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
